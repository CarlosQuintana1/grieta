<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0a09">
  <title>Grieta</title>
  <link rel="icon" href="icono-192.png">
  <link rel="apple-touch-icon" href="icono-180.png">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Grieta">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
  <link rel="stylesheet" href="estilos.css">
</head>
<body data-pantalla="inicio">
  <header class="barra">
    <img src="logo.png" alt="Grieta" class="logo">
    <button id="abrirAcc" type="button" class="barra-boton">Accesibilidad</button>
  </header>

  <div id="mapa" aria-hidden="true"></div>

  <main id="contenido">
    <section id="inicio" class="pantalla" aria-labelledby="tituloInicio">
      <h1 id="tituloInicio" tabindex="-1">¿A dónde vas?</h1>
      <div class="buscador">
        <label for="hacia" class="oculto">Destino</label>
        <input id="hacia" autocomplete="off" placeholder="Escribe un lugar o una calle" enterkeyhint="search">
        <button id="dictar" type="button" class="mic" aria-label="Dictar el destino" hidden>
          <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3" fill="currentColor"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3" stroke="currentColor" stroke-width="1.8" fill="none"/></svg>
        </button>
      </div>
      <p class="desde"><span id="desdeTexto">Buscando tu ubicación...</span> <button id="cambiarDesde" type="button" class="enlace">Cambiar</button></p>
      <div id="buscaDesde" class="buscador chico" hidden>
        <label for="desde" class="oculto">Desde dónde sales</label>
        <input id="desde" autocomplete="off" placeholder="¿Desde dónde sales?">
      </div>
      <p id="estado" class="nota" role="status"></p>
      <ul id="sugerencias" class="lista" aria-label="Lugares"></ul>

      <div id="atajos" class="atajos">
        <button id="pasanAqui" type="button" class="atajo">
          <strong>¿Qué camión pasa aquí?</strong><span>Líneas y horarios de la parada más cercana</span>
        </button>
        <button id="dondeEstoy" type="button" class="atajo">
          <strong>¿Dónde estoy?</strong><span>Tu calle y la parada más cercana</span>
        </button>
      </div>
      <div id="respuesta" aria-live="polite"></div>
    </section>

    <section id="opciones" class="pantalla" aria-labelledby="tituloOpciones" hidden>
      <button type="button" class="atras" data-ir="inicio">Cambiar destino</button>
      <h1 id="tituloOpciones" tabindex="-1"></h1>
      <p class="nota" id="resumenRuta"></p>
      <h2>Cómo llegar</h2>
      <div id="tarjetas" class="tarjetas"></div>

      <div class="plegable">
        <button id="abrirEspera" type="button" aria-expanded="false" aria-controls="espera">
          <span>¿Conviene esperar?</span><span id="respuestaEspera" class="nota"></span>
        </button>
        <div id="espera" hidden>
          <div id="horas" class="horas" role="group" aria-label="Precio según la hora de salida"></div>
          <div id="otraHora" class="otra" hidden>
            <label>Día
              <select id="dia">
                <option value="0">Lunes</option><option value="1">Martes</option><option value="2">Miércoles</option>
                <option value="3">Jueves</option><option value="4">Viernes</option><option value="5">Sábado</option>
                <option value="6">Domingo</option>
              </select>
            </label>
            <label>Hora <input id="hora" type="time"></label>
          </div>
          <p id="mejorHora" class="nota"></p>
        </div>
      </div>
      <p class="nota pie" id="info"></p>
    </section>

    <section id="detalle" class="pantalla" aria-labelledby="tituloDetalle" hidden>
      <button type="button" class="atras" data-ir="opciones">Otras opciones</button>
      <h1 id="tituloDetalle" tabindex="-1"></h1>
      <p class="cifra-linea"><span id="detallePrecio" class="cifra"></span> <span id="detalleLlegada"></span></p>
      <ol id="pasos" class="pasos"></ol>
      <button id="empezar" type="button" class="boton"></button>
      <button id="escuchar" type="button" class="boton-linea">Escuchar los pasos</button>

      <div id="bloqueApp" hidden>
        <h2>Precio en cada app</h2>
        <div id="apps"></div>
        <h2>¿Cuánto te marca la app?</h2>
        <p class="nota">Escríbelo y te digo si conviene pedirlo, esperar o irte en camión.</p>
        <div class="elige" id="appVista" role="group" aria-label="App que abriste">
          <button type="button" data-v="uber" aria-pressed="false">Uber</button>
          <button type="button" data-v="didi" aria-pressed="false">DiDi</button>
          <button type="button" data-v="indrive" aria-pressed="false">inDrive</button>
        </div>
        <label for="precio" class="oculto">Precio que te marca</label>
        <input id="precio" type="number" inputmode="decimal" placeholder="$ 0" class="precio-campo">
        <div class="elige" id="prisa" role="group" aria-label="Qué tanta prisa tienes">
          <button type="button" data-v="5" aria-pressed="false">Tengo prisa</button>
          <button type="button" data-v="20" aria-pressed="true">Normal</button>
          <button type="button" data-v="45" aria-pressed="false">Sin prisa</button>
        </div>
        <div id="veredicto" aria-live="polite"></div>
      </div>
    </section>

    <section id="guia" class="pantalla" aria-labelledby="guiaTitulo" hidden>
      <p class="nota" id="guiaEtapa"></p>
      <h1 id="guiaTitulo" class="guia-titulo" tabindex="-1" aria-live="assertive"></h1>
      <p id="guiaDetalle" class="guia-detalle" aria-live="polite"></p>
      <button id="yaMeSubi" type="button" class="boton" hidden>Ya me subí</button>
      <div class="dos">
        <button id="repetir" type="button" class="boton-linea">Repetir</button>
        <button id="dondeGuia" type="button" class="boton-linea">¿Dónde estoy?</button>
      </div>
      <button id="compartir" type="button" class="boton-linea">Compartir mi viaje</button>
      <button id="terminar" type="button" class="boton-linea">Terminar viaje</button>
      <p class="nota">Deja la pantalla encendida: así Grieta sigue tu ubicación.</p>
    </section>

    <section id="ajustes" class="pantalla" aria-labelledby="tituloAcc" hidden>
      <button type="button" class="atras" id="cerrarAcc">Volver</button>
      <h1 id="tituloAcc" tabindex="-1">Accesibilidad</h1>
      <label class="interruptor"><span><strong>Letra grande</strong></span><input type="checkbox" id="optGrande"></label>
      <label class="interruptor"><span><strong>Alto contraste</strong></span><input type="checkbox" id="optContraste"></label>
      <label class="interruptor"><span><strong>Avisos por voz</strong><small>Apágalo si ya usas VoiceOver o TalkBack</small></span><input type="checkbox" id="optVoz" checked></label>
      <label class="interruptor"><span><strong>Voz más lenta</strong></span><input type="checkbox" id="optLenta"></label>
      <label class="interruptor"><span><strong>Caminar poco</strong><small>Solo paradas a menos de 300 metros</small></span><input type="checkbox" id="optCamino"></label>
    </section>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/h3-js@4.1.0/dist/h3-js.umd.js"></script>
  <script src="grieta.js"></script>
  <script src="app.js"></script>
</body>
</html>
